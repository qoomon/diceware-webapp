    <style>
        :root {
            --color-bg: #1b1b23;
            --color-bg-alt: #1a1a24;
            --color-text: whitesmoke;
            --color-text-light: #e0e0e1;
            --color-muted: #797983;
            --font-family: Inconsolata, serif;
        }

        /* --- Base --- */

        body {
            background-color: var(--color-bg);
            color: var(--color-text);
            margin: 0;
            padding: 0;
            font-family: var(--font-family);
            box-sizing: border-box;
        }

        /* --- Word Grid --- */

        main {
            display: flex;
            justify-content: center;
            margin: 256px auto;
            padding: 2em;
            flex-wrap: wrap;
            row-gap: 2em;
        }

        .word-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 7em;
            padding: 0 1em;
        }

        .word-label {
            font-weight: 300;
            font-size: 1.6em;
            overflow: hidden;
            padding-bottom: 0.8em;
            opacity: 0;
            animation: appear 0.5s both;
        }

        .word-color {
            width: 100%;
            height: 0.25em;
            color: white;
            transition-duration: 1s;
            transition-delay: 1.1s;
        }

        .word-id {
            margin-top: 1em;
            font-size: 0.6em;
            color: var(--color-muted);
            opacity: 0;
            animation: appear 0.5s both;
            user-select: none;
        }

        .dice-container {
            padding-top: 0.6em;
            font-size: 0.9em;
            font-weight: 200;
            color: var(--color-muted);
            cursor: pointer;
            overflow: hidden;
        }

        .dice {
            margin: 0 0.2em;
        }

        /* --- Controls --- */

        #controls {
            position: fixed;
            left: 0;
            right: 0;
            top: 128px;
            display: flex;
            justify-content: center;
            margin: 0 auto;
            font-weight: 300;
            height: 2em;
            font-size: 1.3em;
        }

        #controls .button-icon {
            font-weight: bold;
            font-size: 1.05em;
            padding-left: 1em;
            padding-right: 1em;
        }

        #controls button,
        #controls select {
            -webkit-appearance: none;
            border: 1px solid var(--color-muted);
            margin-left: -1px;
            padding: 0.2em 1.2em;
            background: var(--color-bg-alt);
            color: var(--color-text-light);
            cursor: pointer;
            font-family: var(--font-family);
            font-size: 0.7em;
            font-weight: bold;
        }

        #controls button:active,
        #controls select:active {
            opacity: 60%;
        }

        #controls > *:first-child {
            border-radius: 2em 0 0 2em;
            padding-left: 1.6em;
        }

        #controls > *:last-child {
            border-radius: 0 2em 2em 0;
            padding-right: 1.1em;
        }

        /* --- Toast --- */

        #toast {
            position: fixed;
            margin: auto;
            top: 80vh;
            left: 0;
            right: 0;
            width: fit-content;
            opacity: 1;
            transition: opacity 1s ease-in;
            background-color: var(--color-text-light);
            color: var(--color-bg-alt);
            border: 1px solid var(--color-muted);
            border-radius: 10em;
            padding: 0.6em 1.2em;
            font-weight: bold;
        }

        #toast.fade {
            opacity: 0;
        }
    </style>
    <style>
        /* --- Dice Roll Animations --- */

        .roll-1 {
            transform: translateY(-300%) rotate(20deg);
            animation: roll1 1.1s both;
        }

        .roll-2 {
            transform: translateY(-300%) rotate(-20deg);
            animation: roll2 1.1s both;
        }

        @keyframes roll1 {
            0% {
                transform: translateY(0%) rotate(0deg);
                animation-timing-function: ease-in
            }

            16% {
                transform: translateY(-300%) rotate(20deg);
                animation-timing-function: ease-in
            }

            38% {
                transform: translateY(0) rotate(-20deg);
                animation-timing-function: ease-out
            }

            55% {
                transform: translateY(-70%) rotate(0);
                animation-timing-function: ease-in
            }

            72% {
                transform: translateY(0) rotate(15deg);
                animation-timing-function: ease-out
            }

            81% {
                transform: translateY(-40%) rotate(0);
                animation-timing-function: ease-in
            }

            90% {
                transform: translateY(0) rotate(-8deg);
                animation-timing-function: ease-out
            }

            95% {
                transform: translateY(-10%) rotate(0);
                animation-timing-function: ease-in
            }

            100% {
                transform: translateY(0) rotate(0);
                animation-timing-function: ease-out
            }
        }

        @keyframes roll2 {
            0% {
                transform: translateY(0%) rotate(0deg);
                animation-timing-function: ease-in
            }

            16% {
                transform: translateY(-300%) rotate(-20deg);
                animation-timing-function: ease-in
            }

            38% {
                transform: translateY(0) rotate(20deg);
                animation-timing-function: ease-out
            }

            55% {
                transform: translateY(-70%) rotate(0);
                animation-timing-function: ease-in
            }

            72% {
                transform: translateY(0) rotate(-15deg);
                animation-timing-function: ease-out
            }

            81% {
                transform: translateY(-40%) rotate(0);
                animation-timing-function: ease-in
            }

            90% {
                transform: translateY(0) rotate(8deg);
                animation-timing-function: ease-out
            }

            95% {
                transform: translateY(-10%) rotate(0);
                animation-timing-function: ease-in
            }

            100% {
                transform: translateY(0) rotate(0);
                animation-timing-function: ease-out
            }
        }

        @keyframes appear {
            0% {
                opacity: 0;
                animation-timing-function: ease-in-out;
            }

            100% {
                opacity: 1;
                animation-timing-function: ease-in-out;
            }
        }
    </style>

<body>
<div id="app">
    <main>
        <div v-for="(word, index) in words" :key="index + word.id"
             class="word-container">
            <div class="word-label"
                 :style="{ animationDelay: word.delay + 'ms' }">
                {{ word.word }}
            </div>
            <div class="word-color" :style="{ background: word.color }"></div>
            <div class="dice-container" @click="rerollWord(index)">
                <i v-for="(die, dieIndex) in word.dices" :key="dieIndex"
                   :class="['dice', 'bx', `bx-dice-${die.value}`, `roll-${die.animation}`]"
                   :style="{ animationDelay: die.delay + 'ms' }">
                </i>
            </div>
            <div class="word-id"
                 :style="{ animationDelay: word.delay + 'ms' }">
                {{ word.id }}
            </div>
        </div>
    </main>

    <div id="controls">
        <button @click="rerollWords()">{{ words.length }} Words</button>
        <select v-model="wordlistId">
            <option value="en">English</option>
            <option value="de">German</option>
        </select>
        <button @click="removeWord()" :disabled="words.length <= 1" class="button-icon">−</button>
        <button @click="addWord()" class="button-icon">+</button>
        <button @click="copyWordsToClipboard()" class="button-icon">
            <i class="bx bx-copy" style="display: block;"></i>
        </button>
    </div>

    <div id="toast" v-if="toast.message !== null" :class="{ fade: toast.fade }">
        {{ toast.message }}
    </div>
</div>

<script>
    // --- Constants ---

    const DICE_SIDES = 6;
    const DICE_COUNT = 5;
    const DEFAULT_WORD_COUNT = 6;
    const ROLL_ANIMATION_DURATION_MS = 1100;
    const WORD_APPEAR_OFFSET_MS = 500;
    const SUPPORTED_WORDLISTS = ['en', 'de'];
    const DEFAULT_WORDLIST_ID = 'en';

    // --- Utility Functions ---

    function copyToClipboard(text) {
        return navigator.clipboard.writeText(text);
    }

    function hashColor(str, saturation = 50, lightness = 50, alpha = 100) {
        const hue = bkdrHash(str) % 359;
        return `hsla(${hue}, ${saturation}%, ${lightness}%, ${alpha}%)`;
    }

    // BKDR hash — adapted from https://github.com/zenozeng/color-hash
    function bkdrHash(str) {
        const seed = 131;
        const seed2 = 137;
        const MAX_SAFE = Math.floor(Number.MAX_SAFE_INTEGER / seed2);
        let hash = 0;
        str += '#'; // improve sensitivity for short strings
        for (let i = 0; i < str.length; i++) {
            if (hash > MAX_SAFE) {
                hash = Math.floor(hash / seed2);
            }
            hash = hash * seed + str.charCodeAt(i);
        }
        return hash;
    }

    function randomDiceValue(sides = 6) {
        const randomBuffer = new Uint32Array(1);
        const MAX_UINT32 = 2 ** 32;
        // Largest multiple of range within MAX_UINT32 to avoid modulo bias
        const maxBiasFreeNumber = MAX_UINT32 - (MAX_UINT32 % sides);
        do {
            crypto.getRandomValues(randomBuffer);
        } while (randomBuffer[0] >= maxBiasFreeNumber);
        return (randomBuffer[0] % sides) + 1;
    }

    function verifyDice(dice, rollCount = 1_000_000, validDeviation = 0.01) {
        const results = {};
        for (let i = 0; i < rollCount; i++) {
            const value = dice();
            results[value] = (results[value] || 0) + 1;
        }
        const counts = Object.values(results);
        const spread = Math.abs(Math.min(...counts) - Math.max(...counts));
        console.info('dice verification results:', results);
        if (spread > rollCount * validDeviation) {
            throw new Error('Dice distribution is not uniform');
        }
        console.info('dice verification passed');
    }

    // --- Wordlist Loading ---

    async function loadWordlist(id) {
        let response = await fetch(`./assets/wordlist_${id}.txt`);
        if (response.status !== 200) {
            console.warn(`Wordlist '${id}' not found, falling back to '${DEFAULT_WORDLIST_ID}'`);
            response = await fetch(`./assets/wordlist_${DEFAULT_WORDLIST_ID}.txt`);
        }
        const text = await response.text();
        return new Map(text.split('\n').map(line => line.split('\t')));
    }

    function getInitialWordlistId() {
        const saved = localStorage.getItem('wordlistId');
        if (saved && SUPPORTED_WORDLISTS.includes(saved)) return saved;
        const browserLang = (navigator.language || '').split('-')[0].toLowerCase();
        if (SUPPORTED_WORDLISTS.includes(browserLang)) return browserLang;
        return DEFAULT_WORDLIST_ID;
    }

    // --- Vue App ---

    Vue.createApp({
        setup() {
            const diceWordMap = Vue.ref(new Map());
            const wordlistId = Vue.ref(getInitialWordlistId());
            const words = Vue.ref([]);
            const toast = Vue.ref({ message: null, fade: false });

            // --- Helpers ---

            function rollWord() {
                const dices = Array.from({ length: DICE_COUNT }, () => ({
                    value: randomDiceValue(DICE_SIDES),
                    delay: 400 * Math.random(),
                    animation: randomDiceValue(2),
                }));

                const id = dices.map(d => d.value).join('');
                const rawWord = diceWordMap.value.get(id);
                const word = rawWord[0].toUpperCase() + rawWord.slice(1);
                const color = hashColor(word, 50, 50, 50);
                const maxDiceDelay = Math.max(...dices.map(d => d.delay));

                return {
                    dices,
                    id,
                    word,
                    color,
                    delay: ROLL_ANIMATION_DURATION_MS + maxDiceDelay - WORD_APPEAR_OFFSET_MS,
                };
            }

            function showToast(message) {
                toast.value = { message, fade: false };
                setTimeout(() => { toast.value.fade = true; }, 1000);
                setTimeout(() => { toast.value.message = null; }, 2000);
            }

            // --- Actions ---

            function rerollWords() {
                words.value.forEach((_, i) => rerollWord(i));
            }

            function rerollWord(wordIndex) {
                const currentDices = words.value[wordIndex].dices;
                const newWord = rollWord();
                // Show old dice values initially, then swap to new values after a delay
                words.value[wordIndex] = {
                    ...newWord,
                    dices: newWord.dices.map((die, i) => ({
                        ...die,
                        value: currentDices[i].value,
                    })),
                };
                setTimeout(() => {
                    words.value[wordIndex].dices = words.value[wordIndex].dices.map((die, i) => ({
                        ...die,
                        value: newWord.dices[i].value,
                    }));
                }, WORD_APPEAR_OFFSET_MS);
            }

            function addWord(count = 1) {
                for (let i = 0; i < count; i++) {
                    words.value.push(rollWord());
                }
            }

            function removeWord(count = 1) {
                for (let i = 0; i < count; i++) {
                    if (words.value.length > 1) words.value.pop();
                }
            }

            function copyWordsToClipboard() {
                const passphrase = words.value.map(w => w.word).join(' ');
                copyToClipboard(passphrase);
                showToast('Copied to Clipboard!');
            }

            // --- Lifecycle ---

            Vue.onMounted(async () => {
                verifyDice(() => randomDiceValue(DICE_SIDES));

                diceWordMap.value = await loadWordlist(wordlistId.value);
                addWord(+localStorage.getItem('wordCount') || DEFAULT_WORD_COUNT);

                Vue.watchPostEffect(() => {
                    localStorage.setItem('wordCount', words.value.length);
                });

                Vue.watch(wordlistId, async (newId) => {
                    localStorage.setItem('wordlistId', newId);
                    diceWordMap.value = await loadWordlist(newId);
                    rerollWords();
                });
            });

            return { toast, words, wordlistId, rerollWords, rerollWord, addWord, removeWord, copyWordsToClipboard };
        },
    }).mount('#app');
</script>
